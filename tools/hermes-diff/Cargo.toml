[package]
name = "hermes-diff"
version = "1.0.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
hbc = { package = "hbc-decomp", git = "https://github.com/SymbioticSec/hermes-decomp", rev = "ad4c924720848a26136a56688b70339fe9ea7aba" }
hermes_rs = { version = "0.1.14", features = ["v76", "v84", "v89", "v90", "v93", "v94", "v95", "v96"] }
rusqlite = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
